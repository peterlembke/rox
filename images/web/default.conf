ServerName localhost

# Laravel has a root folder and the HTML files are in the public folder.

<VirtualHost *:80>

  ServerName dev.local
  DocumentRoot "/var/www/public"

  Timeout 600

  <Directory "/var/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
  </Directory>

  # .htaccess does not work in the docker environment because of ProxyPassMatch.
  # All requests are redirected to the app docker box. The .htaccess is never used.
  ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://appserver:9000/var/www/public/$1
  SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

  ErrorLog ${APACHE_LOG_DIR}/error.log
  LogLevel warn
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# AI workspaces — always defined, Apache ignores missing DocumentRoots

<VirtualHost *:80>
  ServerName ai1.dev.local
  ServerAlias ai1.aktivbo-api.aktivbo.dev.local
  DocumentRoot "/var/www/ai1/public"
  Timeout 600
  <Directory "/var/www/ai1">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
  </Directory>
  ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://appserver:9000/var/www/ai1/public/$1
  SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
  ErrorLog ${APACHE_LOG_DIR}/ai1-error.log
  CustomLog ${APACHE_LOG_DIR}/ai1-access.log combined
</VirtualHost>

